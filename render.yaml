# Render Blueprint. Needs a PAID instance because SQLite needs a persistent disk
# (Render's free plan has no disks and wipes files on every deploy / spin-down).
services:
  - type: web
    name: smm-digital-store
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk: {name: data, mountPath: /var/data, sizeGB: 1}
    envVars:
      - {key: NODE_VERSION, value: "22"}
      - {key: DB_PATH, value: /var/data/data.db}
      - {key: JWT_SECRET, generateValue: true}
      - {key: ENC_KEY, generateValue: true}
      - {key: ADMIN_USERNAME, value: admin}
      - {key: ADMIN_EMAIL, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
      - {key: SUPPLIER_API_URL, sync: false}
      - {key: SUPPLIER_API_KEY, sync: false}
      - {key: PAYMENT_WEBHOOK_SECRET, sync: false}
      - {key: BOT_TOKEN, sync: false}
      - {key: ADMIN_CHAT_ID, sync: false}
      - {key: PUBLIC_URL, sync: false}
