<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SMM Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--pri:#0ea5e9;--pri2:#06b6d4;--bg:#f0f9ff;--card:#fff;--tx:#0b1f3a;--mut:#5b7089;--bd:#dbeafe;--ok:#16a34a;--err:#dc2626;--warn:#d97706;--sh:0 4px 16px rgba(14,165,233,.12)}
[data-t=dark]{--bg:#07162b;--card:#0e2340;--tx:#e6f3ff;--mut:#8fa8c4;--bd:#17335a;--sh:0 4px 16px rgba(0,0,0,.4)}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,"Noto Sans Khmer",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header b{font-size:18px}header button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:12px;padding:7px 11px;font-size:16px;cursor:pointer;margin-left:6px}
main{max-width:900px;margin:0 auto;padding:14px;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0}.hero .big{font-size:32px;font-weight:700}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;transition:.15s}.btn:active{transform:scale(.97)}.btn.s{padding:6px 10px;font-size:13px}.btn.g{background:var(--bd);color:var(--tx)}.btn.r{background:var(--err)}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 8px}label{font-size:13px;color:var(--mut);display:block}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav a{flex:1;text-align:center;font-size:11px;color:var(--mut);padding:4px;border-radius:12px;cursor:pointer}nav a i{display:block;font-style:normal;font-size:20px}nav a.on{color:var(--pri);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}.chip{white-space:nowrap;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--bd);cursor:pointer;font-size:13px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bd)}.Completed,.Delivered,.paid,.answered{color:var(--ok)}.Failed,.Cancelled,.rejected{color:var(--err)}.Pending,.pending,.open{color:var(--warn)}.Processing{color:var(--pri)}.Partial{color:#9333ea}
.mut{color:var(--mut);font-size:13px}.pos{color:var(--ok)}.neg{color:var(--err)}h3,h2{margin:4px 0 10px}
.ov{position:fixed;inset:0;background:rgba(3,12,27,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;position:relative;animation:f .2s}.sheet .x{position:absolute;right:12px;top:8px;background:none;border:0;font-size:26px;color:var(--mut);cursor:pointer}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;display:none;max-width:90%}
.sk{height:70px;border-radius:16px;background:linear-gradient(90deg,var(--bd),var(--card),var(--bd));background-size:200%;animation:sk 1.2s infinite;margin-bottom:12px}@keyframes sk{to{background-position:-200%}}
.pimg{height:110px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2)) center/cover;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:36px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.empty{text-align:center;color:var(--mut);padding:30px}.ann{background:#e0f2fe;color:#075985;border-radius:14px;padding:10px 14px;margin-bottom:12px}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:10px;border-radius:10px;margin:6px 0}
</style></head><body data-t="light">
<header><b id="brand">SMM Store</b><span><button id="th" title="Theme">🌙</button><button id="pf" title="Account">👤</button></span></header>
<main id="main"><div class="sk"></div><div class="sk"></div></main><nav id="nav"></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=n=>'$'+(+n).toFixed(+n!==0&&+n<1?4:2),d=s=>esc(String(s||'').slice(0,16)),pill=s=>`<span class="pill ${esc(s)}">${esc(s)}</span>`;
let T=localStorage.t,U=null,CFG={},page='home',P={},TG=window.Telegram&&Telegram.WebApp;
async function api(p,o={}){const r=await fetch('/api'+p,{method:o.m||(o.b?'POST':'GET'),headers:{'Content-Type':'application/json',...(T?{Authorization:'Bearer '+T}:{})},body:o.b?JSON.stringify(o.b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&T){logout();throw new Error('Session expired')}if(!r.ok)throw new Error(j.error||'Error '+r.status);return j}
function toast(t,e){const x=$('#toast');x.textContent=t;x.style.background=e?'var(--err)':'var(--ok)';x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',3000)}
const fld=(n,l,v='',t='text',x='')=>Array.isArray(t)?`<label>${l}<select name="${n}">${t.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`:t==='area'?`<label>${l}<textarea name="${n}" rows="4" ${x}>${esc(v)}</textarea></label>`:`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
function modal(title,body,ok,btn='Submit'){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sheet"><h3>${esc(title)}</h3><form>${body}${ok?`<button class="btn" style="width:100%;margin-top:10px">${btn}</button>`:''}</form><button class="x">×</button></div>`;document.body.append(o);o.querySelector('.x').onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};o.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b&&(b.disabled=1);try{await ok(Object.fromEntries(new FormData(e.target)),o)}catch(x){toast(x.message,1)}b&&(b.disabled=0)};return o}
const empty=t=>`<div class="empty">${t}</div>`;
async function act(fn,msg){try{await fn();msg&&toast(msg);go(page,1)}catch(e){toast(e.message,1)}}
// ---- theme / nav
function theme(t){document.body.dataset.t=t;localStorage.th=t;$('#th').textContent=t==='dark'?'☀️':'🌙'}theme(localStorage.th||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#th').onclick=()=>theme(document.body.dataset.t==='dark'?'light':'dark');$('#pf').onclick=()=>go('account');
const NAV=[['home','🏠','Home'],['smm','🚀','SMM'],['store','🛍️','Store'],['orders','📦','Orders'],['wallet','💳','Wallet']];
$('#nav').innerHTML=NAV.map(n=>`<a data-p="${n[0]}"><i>${n[1]}</i>${n[2]}</a>`).join('');$('#nav').onclick=e=>{const a=e.target.closest('a');a&&go(a.dataset.p)};
async function go(p,keep){page=p;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));if(!keep)$('#main').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  try{$('#main').innerHTML=await P[p]();window.scrollTo(0,0)}catch(e){$('#main').innerHTML=`<div class="card empty">⚠️ ${esc(e.message)}<br><br><button class="btn s" onclick="go('${p}')">Retry</button></div>`}}
// ---- auth
function authScreen(){$('#nav').style.display='none';let reg=0;const draw=()=>{$('#main').innerHTML=`<div class="card" style="max-width:420px;margin:30px auto"><h2>${reg?'Create account':'Welcome back'}</h2><form id="af">${fld('username','Username')}${reg?fld('email','Email (optional)','','email'):''}${fld('password','Password (8+ characters)','','password')}<button class="btn" style="width:100%">${reg?'Register':'Login'}</button></form><p class="mut" style="text-align:center;cursor:pointer" id="sw">${reg?'Have an account? Login':'No account? Register'}</p></div>`;
  $('#sw').onclick=()=>{reg=!reg;draw()};$('#af').onsubmit=async e=>{e.preventDefault();try{const r=await api(reg?'/auth/register':'/auth/login',{b:Object.fromEntries(new FormData(e.target))});T=r.token;localStorage.t=T;boot()}catch(x){toast(x.message,1)}}};draw()}
function logout(){localStorage.removeItem('t');T=null;U=null;authScreen()}
async function boot(){try{CFG=await api('/config');$('#brand').textContent=CFG.brand||'SMM Store';
  if(!T&&TG&&TG.initData){TG.ready();TG.expand();try{const r=await api('/auth/telegram',{b:{initData:TG.initData}});T=r.token;localStorage.t=T}catch{}}
  if(!T)return authScreen();U=await api('/me');$('#nav').style.display='flex';go('home')}catch(e){if(!T)authScreen();else $('#main').innerHTML=empty('⚠️ '+esc(e.message))}}
// ---- pages
const sv=s=>`<div class="card"><div class="row"><b>${esc(s.name)}</b><span class="pill">#${s.id}</span></div><div class="mut">${esc(s.category)} · ${m(s.price)}/1000 · min ${s.min_qty} · max ${s.max_qty}</div><div class="row" style="margin-top:8px"><span class="mut">${esc(s.delivery||'Start: instant')}</span><button class="btn s" onclick="orderSvc(${s.id})">Order</button></div></div>`;
let SVC=[],PRD=[];
P.home=async()=>{const[w,so,po,sv2,pr,dq]=await Promise.all([api('/wallet'),api('/smm/orders'),api('/store/orders'),api('/smm/services'),api('/promos'),api('/store/products')]);SVC=sv2;PRD=dq;U.balance=w.balance;
 return `${CFG.announcement?`<div class="ann">📢 ${esc(CFG.announcement)}</div>`:''}<div class="card hero"><div>Available balance</div><div class="big">${m(w.balance)}</div><button class="btn s g" style="margin-top:8px" onclick="go('wallet')">+ Add funds</button></div>
 <div class="grid"><div class="card" onclick="go('smm')" style="cursor:pointer"><h3>🚀 SMM Services</h3><span class="mut">TikTok · Facebook · Telegram</span></div><div class="card" onclick="go('store')" style="cursor:pointer"><h3>🛍️ Digital Store</h3><span class="mut">Apps · Keys · Premium</span></div></div>
 ${pr.length?`<h3>🎁 Promotions</h3>${pr.map(p=>`<div class="ann">${esc(p.title||p.code)} — code <b>${esc(p.code)}</b>: +${p.bonus_percent}% bonus on deposits</div>`).join('')}`:''}
 <h3>Featured services</h3><div class="grid">${sv2.slice(0,4).map(sv).join('')||empty('No services yet')}</div>
 <h3>Featured products</h3><div class="grid">${dq.slice(0,4).map(pc).join('')||empty('No products yet')}</div>
 <h3>Recent orders</h3>${[...so.map(o=>({t:o.service_name,s:o.status,c:o.charge,d:o.created})),...po.map(o=>({t:o.product_name,s:o.status,c:o.price,d:o.created}))].sort((a,b)=>b.d>a.d?1:-1).slice(0,5).map(o=>`<div class="card row"><span>${esc(o.t)}<br><span class="mut">${d(o.d)}</span></span><span>${m(o.c)} ${pill(o.s)}</span></div>`).join('')||empty('No orders yet')}
 <h3>Wallet summary</h3>${w.transactions.slice(0,4).map(t=>`<div class="row mut"><span>${esc(t.type)} · ${esc(t.note)}</span><b class="${t.amount>0?'pos':'neg'}">${t.amount>0?'+':''}${m(t.amount)}</b></div>`).join('')||empty('No transactions')}`};
let cat='All',q='';
P.smm=async()=>{SVC=await api('/smm/services');return smmView()};
function smmView(){const cats=['All',...new Set(SVC.map(s=>s.category))],l=SVC.filter(s=>(cat==='All'||s.category===cat)&&(!q||(s.name+s.id).toLowerCase().includes(q.toLowerCase())));
 return `<div class="chips">${cats.map(c=>`<span class="chip ${c===cat?'on':''}" onclick="cat='${esc(c)}';sm()">${esc(c)}</span>`).join('')}</div><input id="q" placeholder="🔍 Search by name or ID" value="${esc(q)}" oninput="q=this.value;clearTimeout(window._s);window._s=setTimeout(()=>{sm();$('#q').focus()},250)">${l.map(sv).join('')||empty('No services found')}`}
const sm=()=>{$('#main').innerHTML=smmView();if(q){const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)}};
function orderSvc(id){const s=SVC.find(x=>x.id===id),o=modal(s.name,`<div class="mut">ID #${s.id} · ${m(s.price)} per 1000 · ${s.min_qty}–${s.max_qty}</div><p>${esc(s.description)}</p>${fld('link','Target link / @username')}${fld('quantity','Quantity',s.min_qty,'number',`min="${s.min_qty}" max="${s.max_qty}" id="qty"`)}<p><b>Total: <span id="tot">${m(s.price*s.min_qty/1000)}</span></b> <span class="mut">(balance ${m(U.balance)})</span></p>`,async f=>{if(!confirm(`Confirm order for ${$('#tot').textContent}?`))return;await api('/smm/order',{b:{service_id:id,...f}});o.remove();toast('Order placed ✅');U=await api('/me');go('orders')},'Place order');
 o.querySelector('#qty').oninput=e=>o.querySelector('#tot').textContent=m(s.price*(+e.target.value||0)/1000)}
const pc=p=>`<div class="card" onclick="prod(${p.id})" style="cursor:pointer"><div class="pimg" style="${p.image?`background-image:url('${esc(p.image)}')`:''}">${p.image?'':'🎁'}</div><b>${esc(p.name)}</b><div class="row"><span>${m(p.price)}</span>${p.stock>0?`<span class="mut">Stock ${p.stock}</span>`:'<span class="pill Failed">Sold out</span>'}</div></div>`;
let pcat='All',pq='';
P.store=async()=>{PRD=await api('/store/products');return storeView()};
function storeView(){const cats=['All',...new Set(PRD.map(p=>p.category))],l=PRD.filter(p=>(pcat==='All'||p.category===pcat)&&(!pq||p.name.toLowerCase().includes(pq.toLowerCase())));
 return `<div class="chips">${cats.map(c=>`<span class="chip ${c===pcat?'on':''}" onclick="pcat='${esc(c)}';$('#main').innerHTML=storeView()">${esc(c)}</span>`).join('')}</div><input id="pq" placeholder="🔍 Search products" value="${esc(pq)}" oninput="pq=this.value;clearTimeout(window._s);window._s=setTimeout(()=>{$('#main').innerHTML=storeView();const i=$('#pq');i.focus();i.setSelectionRange(pq.length,pq.length)},250)"><div class="grid">${l.map(pc).join('')||empty('No products found')}</div>`}
function prod(id){const p=PRD.find(x=>x.id===id);modal(p.name,`<div class="pimg" style="${p.image?`background-image:url('${esc(p.image)}')`:''}">${p.image?'':'🎁'}</div><p>${esc(p.description)}</p><p class="mut">${esc(p.category)} · ${p.delivery_type==='auto'?'⚡ Instant delivery':'👤 Manual delivery by admin'}</p><b>${m(p.price)}</b>${p.stock>0?fld('quantity','Quantity',1,'number',`min="1" max="${Math.min(20,p.stock)}"`):'<p class="neg">Sold out</p>'}`,p.stock>0&&(async(f,o)=>{if(!confirm('Buy now?'))return;await api('/store/buy',{b:{product_id:id,...f}});o.remove();toast('Purchase complete ✅');U=await api('/me');go('orders')}),'Buy now')}
let otab='smm';
P.orders=async()=>{const[a,b]=await Promise.all([api('/smm/orders'),api('/store/orders')]);
 return `<div class="tabs"><span class="chip ${otab==='smm'?'on':''}" onclick="otab='smm';go('orders',1)">SMM</span><span class="chip ${otab==='dig'?'on':''}" onclick="otab='dig';go('orders',1)">Digital</span><button class="btn s g" onclick="go('orders')">↻</button></div>`+(otab==='smm'?a.map(o=>`<div class="card"><div class="row"><b>#${o.id} ${esc(o.service_name)}</b>${pill(o.status)}</div><div class="mut" style="word-break:break-all">${esc(o.link)}</div><div class="row mut"><span>Qty ${o.quantity} · ${m(o.charge)}${o.refunded?` · refunded ${m(o.refunded)}`:''}</span><span>${d(o.created)}</span></div>${o.error&&!['Completed'].includes(o.status)?`<div class="mut">ℹ️ ${esc(o.error)}</div>`:''}</div>`).join('')||empty('No SMM orders yet'):b.map(o=>`<div class="card"><div class="row"><b>#${o.id} ${esc(o.product_name)} ×${o.quantity}</b>${pill(o.status)}</div><div class="mut">${m(o.price)} · ${d(o.created)}</div>${o.delivery?`<button class="btn s g" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">🔑 Show / hide delivery</button><pre hidden>${esc(o.delivery)}</pre>`:'<div class="mut">⏳ Waiting for admin delivery</div>'}</div>`).join('')||empty('No purchases yet'))};
P.wallet=async()=>{const w=await api('/wallet'),i=w.instructions;U.balance=w.balance;
 return `<div class="card hero"><div>Balance</div><div class="big">${m(w.balance)}</div><button class="btn s g" style="margin-top:8px" onclick="deposit(${i.min})">+ Add funds (ABA KHQR)</button></div><h3>Deposits</h3>${w.payments.map(p=>`<div class="card"><div class="row"><b>${m(p.amount)}${p.bonus?` +${m(p.bonus)} bonus`:''}</b>${pill(p.status)}</div><div class="mut">${esc(p.ref)} · ${d(p.created)}</div>${p.status==='pending'?`<button class="btn s g" onclick='payInfo(${JSON.stringify({ref:p.ref,amount:p.amount})})'>Payment instructions</button>`:''}</div>`).join('')||empty('No deposits yet')}<h3>Transactions</h3>${w.transactions.map(t=>`<div class="row card"><span>${esc(t.type)}<br><span class="mut">${esc(t.note)} · ${d(t.created)}</span></span><b class="${t.amount>0?'pos':'neg'}">${t.amount>0?'+':''}${m(t.amount)}</b></div>`).join('')||empty('No transactions')}`};
function deposit(min){modal('Add funds',fld('amount','Amount (USD)',min,'number',`min="${min}" step="0.01"`)+fld('promo','Promo code (optional)'),async(f,o)=>{const r=await api('/wallet/deposit',{b:f});o.remove();payInfo(r);go('wallet',1)},'Create payment')}
async function payInfo(p){const i=(await api('/wallet')).instructions;modal('Pay with ABA KHQR',`<div style="text-align:center">${i.qr?`<img src="${esc(i.qr)}" style="max-width:240px;width:100%;border-radius:12px">`:''}<p>Send exactly <b>${m(p.amount)}</b> to<br><b>${esc(i.name)||'—'}</b><br>${esc(i.account)}</p><p>Reference: <b>${esc(p.ref)}</b></p><p class="mut">Include the reference in the payment note. Your balance is credited only after the payment is verified.</p></div>`)}
P.account=async()=>{const n=await api('/notifications');return `<div class="card"><div class="row"><div><b style="font-size:18px">${esc(U.username)}</b><br><span class="mut">${esc(U.email||'')} ${U.role==='admin'?'· Admin':''}</span></div><b>${m(U.balance)}</b></div></div><div class="grid"><button class="btn" onclick="go('support')">💬 Support</button>${U.role==='admin'?'<button class="btn" onclick="go(\'admin\')">🛠️ Admin panel</button>':''}<button class="btn g" onclick="pw()">🔒 Change password</button><button class="btn r" onclick="logout()">Logout</button></div><h3 style="margin-top:14px">🔔 Notifications</h3>${n.map(x=>`<div class="card">${esc(x.text)}<div class="mut">${d(x.created)}</div></div>`).join('')||empty('No notifications')}`};
function pw(){modal('Change password',fld('old','Current password','','password')+fld('new','New password','','password'),async(f,o)=>{await api('/me/password',{b:f});o.remove();toast('Password updated')})}
P.support=async()=>{const t=await api('/tickets');return `<div class="row"><h3>Support tickets</h3><button class="btn s" onclick="newTicket()">+ New</button></div>${t.map(x=>`<div class="card row" onclick="ticket(${x.id})" style="cursor:pointer"><span><b>#${x.id} ${esc(x.subject)}</b><br><span class="mut">${esc(x.username||'')} ${d(x.created)}</span></span>${pill(x.status)}</div>`).join('')||empty('No tickets')}`};
function newTicket(){modal('New ticket',fld('subject','Subject')+fld('message','Message','','area'),async(f,o)=>{await api('/tickets',{b:f});o.remove();go('support')})}
async function ticket(id){const r=await api('/tickets/'+id);modal('#'+id+' '+r.ticket.subject,r.messages.map(x=>`<div class="card" style="${x.is_admin?'border-color:var(--pri)':''}"><span class="mut">${x.is_admin?'Support':'User'} · ${d(x.created)}</span><br>${esc(x.body)}</div>`).join('')+fld('message','Reply','','area'),async(f,o)=>{await api(`/tickets/${id}/reply`,{b:f});o.remove();ticket(id)},'Send reply')}
// ---- admin
let atab='stats';const AT=['stats','users','payments','services','products','smm','digital','tickets','promos','settings','logs'];
const ad=(p,o)=>api('/admin'+p,o);
P.admin=async()=>{const hd=`<div class="tabs">${AT.map(t=>`<span class="chip ${t===atab?'on':''}" onclick="atab='${t}';go('admin')">${t}</span>`).join('')}</div>`;return hd+await AP[atab]()};
const AP={
stats:async()=>{const s=await ad('/stats'),sup=await ad('/supplier/status');return `<div class="grid">${Object.entries(s).map(([k,v])=>`<div class="card"><span class="mut">${k.replace('_',' ')}</span><div style="font-size:22px;font-weight:700">${/balances|revenue|deposits/.test(k)?m(v):v}</div></div>`).join('')}</div><div class="card">Supplier: ${sup.connected?`<b class="pos">connected</b> · balance ${esc(sup.balance)} ${esc(sup.currency||'')}`:`<b class="neg">not connected</b> <span class="mut">${esc(sup.error||'')}</span>`}</div>`},
users:async()=>(await ad('/users')).map(u=>`<div class="card"><div class="row"><b>${esc(u.username)} ${u.role==='admin'?'👑':''}</b><b>${m(u.balance)}</b></div><div class="mut">#${u.id} ${esc(u.email||'')} ${u.banned?'· BANNED':''}</div><div class="row" style="justify-content:flex-start;margin-top:6px"><button class="btn s" onclick="adjust(${u.id})">± Balance</button><button class="btn s g" onclick="act(()=>ad('/users/${u.id}/ban',{b:{banned:${u.banned?0:1}}}))">${u.banned?'Unban':'Ban'}</button></div></div>`).join(''),
payments:async()=>(await ad('/payments')).map(p=>`<div class="card"><div class="row"><b>${esc(p.username)} · ${m(p.amount)}</b>${pill(p.status)}</div><div class="mut">${esc(p.ref)} · ${d(p.created)}</div>${p.status==='pending'?`<div class="row" style="justify-content:flex-start;margin-top:6px"><button class="btn s" onclick="if(confirm('Confirm that the money was received?'))act(()=>ad('/payments/${p.id}/confirm',{b:{}}),'Confirmed')">Confirm</button><button class="btn s r" onclick="act(()=>ad('/payments/${p.id}/reject',{b:{}}))">Reject</button></div>`:''}</div>`).join('')||empty('No payments'),
services:async()=>{const l=await ad('/services');return `<div class="row" style="justify-content:flex-start;margin-bottom:10px"><button class="btn s" onclick="svcForm()">+ Add</button><button class="btn s g" onclick="imp()">⬇ Import from supplier</button></div>`+l.map(s=>`<div class="card"><div class="row"><b>#${s.id} ${esc(s.name)}</b>${s.enabled?'<span class="pill Completed">on</span>':'<span class="pill">off</span>'}</div><div class="mut">${esc(s.category)} · sell ${m(s.price)} · cost ${m(s.cost)} · ${s.min_qty}-${s.max_qty} · supplier ${esc(s.supplier_service||'manual')}</div><div class="row" style="justify-content:flex-start;margin-top:6px"><button class="btn s" onclick='svcForm(${JSON.stringify(s).replace(/'/g,"&#39;")})'>Edit</button><button class="btn s g" onclick="act(()=>ad('/services/${s.id}',{m:'PUT',b:{enabled:${s.enabled?0:1}}}))">${s.enabled?'Disable':'Enable'}</button><button class="btn s r" onclick="if(confirm('Delete?'))act(()=>ad('/services/${s.id}',{m:'DELETE'}))">Delete</button></div></div>`).join('')},
products:async()=>{const l=await ad('/products');return `<button class="btn s" style="margin-bottom:10px" onclick="prodForm()">+ Add product</button>`+l.map(p=>`<div class="card"><div class="row"><b>#${p.id} ${esc(p.name)}</b><span>${m(p.price)}</span></div><div class="mut">${esc(p.category)} · ${p.delivery_type} · stock ${p.delivery_type==='auto'?p.inv:p.stock} · ${p.enabled?'on':'off'}</div><div class="row" style="justify-content:flex-start;margin-top:6px"><button class="btn s" onclick='prodForm(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Edit</button>${p.delivery_type==='auto'?`<button class="btn s g" onclick="stock(${p.id})">+ Codes</button>`:''}<button class="btn s g" onclick="act(()=>ad('/products/${p.id}',{m:'PUT',b:{enabled:${p.enabled?0:1}}}))">${p.enabled?'Disable':'Enable'}</button><button class="btn s r" onclick="if(confirm('Delete product and its stock?'))act(()=>ad('/products/${p.id}',{m:'DELETE'}))">Delete</button></div></div>`).join('')},
smm:async()=>`<button class="btn s" style="margin-bottom:10px" onclick="act(()=>ad('/orders/smm/sync',{b:{}}),'Synced')">↻ Sync with supplier</button>`+(await ad('/orders/smm')).map(o=>`<div class="card"><div class="row"><b>#${o.id} ${esc(o.username)} · ${esc(o.service_name)}</b>${pill(o.status)}</div><div class="mut" style="word-break:break-all">${esc(o.link)} · ${o.quantity} · ${m(o.charge)} · sup ${esc(o.supplier_order||'-')}</div>${o.error?`<div class="mut">⚠ ${esc(o.error)}</div>`:''}<button class="btn s g" onclick="smmStatus(${o.id})">Set status</button></div>`).join(''),
digital:async()=>(await ad('/orders/digital')).map(o=>`<div class="card"><div class="row"><b>#${o.id} ${esc(o.username)} · ${esc(o.product_name)} ×${o.quantity}</b>${pill(o.status)}</div><div class="mut">${m(o.price)} · ${d(o.created)}</div>${o.status==='Pending'?`<button class="btn s" onclick="deliver(${o.id})">Deliver</button>`:''}</div>`).join('')||empty('No orders'),
tickets:async()=>P.support(),
promos:async()=>`<button class="btn s" style="margin-bottom:10px" onclick="promoForm()">+ Add promo</button>`+(await ad('/promos')).map(p=>`<div class="card row"><span><b>${esc(p.code)}</b> +${p.bonus_percent}% <span class="mut">${esc(p.title)}</span></span><button class="btn s r" onclick="act(()=>ad('/promos/${p.id}',{m:'DELETE'}))">✕</button></div>`).join(''),
settings:async()=>{const s=await ad('/settings');return `<div class="card"><form id="sf">${fld('brand','Brand name',s.brand)}${fld('announcement','Announcement',s.announcement)}${fld('aba_name','ABA account name',s.aba_name)}${fld('aba_account','ABA account number',s.aba_account)}${fld('khqr_image','KHQR image URL',s.khqr_image)}${fld('min_deposit','Minimum deposit (USD)',s.min_deposit||1,'number')}<button class="btn" style="width:100%">Save</button></form></div>`},
logs:async()=>(await ad('/logs')).map(l=>`<div class="card mut"><b>${esc(l.action)}</b> · ${esc(l.username||'system')} · ${d(l.created)}<br>${esc(l.detail)}</div>`).join('')};
new MutationObserver(()=>{const f=$('#sf');if(f&&!f._b){f._b=1;f.onsubmit=e=>{e.preventDefault();act(()=>ad('/settings',{m:'PUT',b:Object.fromEntries(new FormData(f))}),'Saved')}}}).observe($('#main'),{childList:true});
const adjust=id=>modal('Adjust balance',fld('amount','Amount (negative to deduct)','','number','step="0.01"')+fld('note','Reason (audit log)'),async(f,o)=>{await ad(`/users/${id}/balance`,{b:f});o.remove();toast('Done');go('admin',1)});
const svcForm=s=>{s=s||{};modal(s.id?'Edit service':'New service',fld('category','Category',s.category||'TikTok',['TikTok','Facebook','Telegram','Other'])+fld('name','Name',s.name)+fld('description','Description',s.description,'area')+fld('price','Sell price per 1000',s.price,'number','step="0.0001"')+fld('cost','Cost per 1000',s.cost||0,'number','step="0.0001"')+fld('min_qty','Min',s.min_qty,'number')+fld('max_qty','Max',s.max_qty,'number')+fld('delivery','Delivery info',s.delivery)+fld('supplier_service','Supplier service ID (blank = manual)',s.supplier_service),async(f,o)=>{f.supplier_service=f.supplier_service||null;await(s.id?ad('/services/'+s.id,{m:'PUT',b:f}):ad('/services',{b:f}));o.remove();go('admin',1)})};
const prodForm=p=>{p=p||{};modal(p.id?'Edit product':'New product',fld('category','Category',p.category||'Apps',['Apps','Software','Tools','Codes','Other'])+fld('name','Name',p.name)+fld('description','Description',p.description,'area')+fld('image','Image URL',p.image)+fld('price','Price (USD)',p.price,'number','step="0.01"')+(p.id?'':fld('delivery_type','Delivery',p.delivery_type||'auto',['auto','manual']))+fld('stock','Stock (manual products only)',p.stock||0,'number'),async(f,o)=>{await(p.id?ad('/products/'+p.id,{m:'PUT',b:f}):ad('/products',{b:f}));o.remove();go('admin',1)})};
const stock=id=>modal('Add stock',fld('codes','One code / account per line','','area','rows="8"'),async(f,o)=>{const r=await ad(`/products/${id}/stock`,{b:f});o.remove();toast(r.added+' added');go('admin',1)});
const imp=()=>modal('Import from supplier',fld('markup','Markup % over supplier cost',30,'number'),async(f,o)=>{const r=await ad('/services/import',{b:f});o.remove();toast(`${r.added} new, ${r.updated} updated (new ones are disabled)`);go('admin',1)},'Import');
const smmStatus=id=>modal('Set order status',fld('status','Status','Processing',['Pending','Processing','Completed','Partial','Failed','Cancelled'])+fld('remains','Remaining qty (Partial only)',0,'number'),async(f,o)=>{await ad(`/orders/smm/${id}/status`,{b:f});o.remove();go('admin',1)});
const deliver=id=>modal('Manual delivery',fld('text','Credentials / code / message to send to buyer','','area'),async(f,o)=>{await ad(`/orders/digital/${id}/deliver`,{b:f});o.remove();toast('Delivered');go('admin',1)});
const promoForm=()=>modal('New promo',fld('code','Code')+fld('title','Title')+fld('bonus_percent','Deposit bonus %',10,'number'),async(f,o)=>{await ad('/promos',{b:f});o.remove();go('admin',1)});
boot();
</script></body></html>
