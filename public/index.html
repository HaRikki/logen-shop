function shrink(file,max,type){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL(type,.86))};im.onerror=()=>no(new Error('This file is not a readable image'));im.src=u})}

users:async()=>{const l=await ad('/users');return searchBar('Search users')+`<div id="alist">${l.map(u=>ac(u.username+' '+(u.email||'')+' '+u.id,1,`<div class="row"><div class="row st"><span class="ico" style="border-radius:50%;font-weight:700">${esc(u.username[0].toUpperCase())}</span><div><b>${esc(u.username)} ${u.role==='admin'?'<span class="pill">admin</span>':''}</b><div class="mut">#${u.id} ${esc(u.email||'')} ${u.banned?'· <span class="neg">banned</span>':''}</div></div></div><b>${m(u.balance)}</b></div><div class="row st" style="margin-top:10px"><button class="btn s" onclick="adjust(${u.id})">Adjust balance</button><button class="btn s g" onclick="act(()=>ad('/users/${u.id}/ban',{b:{banned:${u.banned?0:1}}}))">${u.banned?'Unban':'Ban'}</button></div>`)).join('')}</div>`},
payments:async()=>(await ad('/payments')).map(p=>`<div class="card"><div class="row"><b>${esc(p.username)} · ${m(p.amount)}${p.bonus?` <span class="pos">+${m(p.bonus)}</span>`:''}</b>${pill(p.status)}</div><div class="mut">${esc(p.ref)} · ${d(p.created)}</div>${p.status==='pending'?`<div class="row st" style="margin-top:10px"><button class="btn s" onclick="if(confirm('Did the money arrive in your account?'))act(()=>ad('/payments/${p.id}/confirm',{b:{}}),'Payment confirmed')">Confirm</button><button class="btn s r" onclick="act(()=>ad('/payments/${p.id}/reject',{b:{}}))">Reject</button></div>`:''}</div>`).join('')||`<div class="card">${empty('No payments yet')}</div>`,
services:async()=>{ASV=await ad('/services');
 return `<div class="row st wrap" style="margin-bottom:10px"><button class="btn s" onclick="svcForm()">${ic('plus',15)} Add service</button><button class="btn s g" onclick="imp()">Import from supplier</button><span class="mut">${ASV.filter(s=>s.enabled).length} of ${ASV.length} enabled</span></div>`+searchBar('Search services',1)+`<div class="row st" style="margin:0 0 10px"><button class="btn s g" onclick="selAll()">Select all shown</button></div><div id="alist">${ASV.map(s=>{const pf=s.price-s.cost;return ac(s.name+' '+s.category+' '+s.id+' '+(s.supplier_service||''),s.enabled,`<div class="row"><label class="ck" style="margin:0;flex:1;min-width:0"><input type="checkbox" class="cb" data-id="${s.id}" ${SEL.has(s.id)?'checked':''} onchange="sel(${s.id},this.checked)"><span style="overflow:hidden;text-overflow:ellipsis"><b>#${s.id} ${esc(s.name)}</b></span></label>${s.enabled?'<span class="pill Completed">on</span>':'<span class="pill">off</span>'}</div><div class="mut" style="margin:4px 0 0 28px">${esc(s.category)} · sell ${m(s.price)} · cost ${m(s.cost)} · <span class="${pf>=0?'pos':'neg'}">profit ${m(pf)}</span> · ${nf(s.min_qty)}–${nf(s.max_qty)} · ${s.supplier_service?'supplier '+esc(s.supplier_service):'manual'}</div><div class="row st" style="margin:10px 0 0 28px"><button class="btn s" onclick="svcForm(${s.id})">Edit</button><button class="btn s g" onclick="act(()=>ad('/services/${s.id}',{m:'PUT',b:{enabled:${s.enabled?0:1}}}))">${s.enabled?'Disable':'Enable'}</button><button class="btn s r" onclick="if(confirm('Delete this service?'))act(()=>ad('/services/${s.id}',{m:'DELETE'}))">Delete</button></div>`)}).join('')}</div><div class="bulk" id="bulk" ${SEL.size?'':'hidden'}><b><span id="bn">${SEL.size}</span> selected</b><span class="row st"><button class="btn s" onclick="bulk(1)">Enable</button><button class="btn s g" onclick="bulk(0)">Disable</button></span></div>`},
products:async()=>{APR=await ad('/products');return `<div class="row st" style="margin-bottom:10px"><button class="btn s" onclick="prodForm()">${ic('plus',15)} Add product</button></div>`+searchBar('Search products',1)+`<div id="alist">${APR.map(p=>ac(p.name+' '+p.category+' '+p.id,p.enabled,`<div class="row st"><div class="thumb" style="${p.image?`background-image:url('${esc(p.image)}')`:''}"></div><div class="grow"><div class="row"><b>#${p.id} ${esc(p.name)}</b><b>${m(p.price)}</b></div><div class="mut">${esc(p.category)} · ${p.delivery_type} · stock ${p.delivery_type==='auto'?p.inv:p.stock} · ${p.enabled?'<span class="pos">on</span>':'off'}</div></div></div><div class="row st" style="margin-top:10px"><button class="btn s" onclick="prodForm(${p.id})">Edit</button>${p.delivery_type==='auto'?`<button class="btn s g" onclick="stock(${p.id})">Add codes</button>`:''}<button class="btn s g" onclick="act(()=>ad('/products/${p.id}',{m:'PUT',b:{enabled:${p.enabled?0:1}}}))">${p.enabled?'Disable':'Enable'}</button><button class="btn s r" onclick="if(confirm('Delete this product and its stock?'))act(()=>ad('/products/${p.id}',{m:'DELETE'}))">Delete</button></div>`)).join('')||`<div class="card">${empty('No products yet')}</div>`}</div>`},
smm:async()=>`<button class="btn s" style="margin-bottom:10px" onclick="act(()=>ad('/orders/smm/sync',{b:{}}),'Synced with supplier')">${ic('refresh',15)} Sync with supplier</button>`+((await ad('/orders/smm')).map(o=>`<div class="card"><div class="row"><b>#${o.id} ${esc(o.username)} · ${esc(o.service_name)}</b>${pill(o.status)}</div><div class="mut" style="word-break:break-all">${esc(o.link)} · ${nf(o.quantity)} · ${m(o.charge)} · supplier ${esc(o.supplier_order||'-')}</div>${o.error?`<div class="mut">${esc(o.error)}</div>`:''}<button class="btn s g" style="margin-top:10px" onclick="smmStatus(${o.id})">Set status</button></div>`).join('')||`<div class="card">${empty('No service orders yet')}</div>`),
digital:async()=>(await ad('/orders/digital')).map(o=>`<div class="card"><div class="row"><b>#${o.id} ${esc(o.username)} · ${esc(o.product_name)} ×${o.quantity}</b>${pill(o.status)}</div><div class="mut">${m(o.price)} · ${d(o.created)}</div>${o.status==='Pending'?`<button class="btn s" style="margin-top:10px" onclick="deliver(${o.id})">Deliver</button>`:''}</div>`).join('')||`<div class="card">${empty('No digital orders yet')}</div>`,
tickets:async()=>P.support(),
promos:async()=>`<button class="btn s" style="margin-bottom:10px" onclick="promoForm()">${ic('plus',15)} Add offer</button>`+((await ad('/promos')).map(p=>`<div class="card row"><span><b>${esc(p.code)}</b> +${p.bonus_percent}% <span class="mut">${esc(p.title)}</span></span><button class="btn s r" onclick="act(()=>ad('/promos/${p.id}',{m:'DELETE'}))">Delete</button></div>`).join('')||`<div class="card">${empty('No offers yet','Offers appear on every customer\'s Home screen.')}</div>`),
settings:async()=>{const s=await ad('/settings'),a=okHex(s.accent)?s.accent:'#1769e0';
 return `<div class="ed two"><form id="sf" novalidate>
 <fieldset><legend>Brand</legend>${imgField('logo','Logo',s.logo,256,'image/png')}${fld('brand','Shop name',s.brand,'text','maxlength="40"')}${fld('tagline','Tagline (shown on the login screen)',s.tagline,'text','maxlength="120" placeholder="SMM services and digital products in one place"')}<label>Accent colour<input type="color" name="accent" value="${a}"></label><div class="sw">${['#1769e0','#0891b2','#0d9488','#7c3aed','#e11d48','#ea580c','#0a1d36'].map(c=>`<button type="button" style="background:${c}" data-set="accent=${c}" aria-label="${c}"></button>`).join('')}</div></fieldset>
 <fieldset><legend>Home screen</legend>${fld('announcement','Announcement banner (leave empty to hide)',s.announcement,'area','rows="2" maxlength="300"')}${fld('support_link','Support link (Telegram or website)',s.support_link,'text','placeholder="https://t.me/yourname"')}</fieldset>
 <fieldset><legend>Payments</legend>${fld('aba_name','ABA account name',s.aba_name)}${fld('aba_account','ABA account number',s.aba_account)}${imgField('khqr_image','KHQR image',s.khqr_image,720,'image/png',1)}${fld('min_deposit','Minimum deposit (USD)',s.min_deposit||1,'number','step="0.01" min="0"')}</fieldset>
 <div class="savebar"><button class="btn blk" id="sv">Save changes</button></div></form>
 <div class="pv"><div class="mut" style="margin-bottom:8px">Live preview</div><div class="phone" id="pv" style="${bv(a)}"><div class="bn" id="pvb"></div><div class="ann" id="pva" ${s.announcement?'':'hidden'}>${ic('megaphone',16)}<span></span></div><div class="wallet"><div class="w-hi">Hi, customer</div><div class="w-bal">$12.50</div><span class="btn s wh">${ic('plus',14)} Add funds</span></div><div class="mut" id="pvt"></div></div></div></div>`},
login:async()=>{const t=(await ad('/login')).telegram,o=location.origin,uri=o+'/api/auth/telegram/callback',cp=v=>`<button type="button" data-copy="${esc(v)}" aria-label="Copy">${ic('copy',16)}</button>`;
 return `<div class="ed two"><form id="lf" novalidate>
 <fieldset><legend>Telegram login</legend>${chk('enabled','Show the Telegram button on the customer login screen',t.enabled)}
 <div class="mut" style="margin-bottom:10px">Open <b>@BotFather</b> → your bot → <b>Login Widget</b>. Add these two links as Allowed URLs, then copy the Client ID and Client Secret into the boxes below.</div>
 <div class="copy"><div><span class="mut">Website URL</span><br><b>${esc(o)}</b></div>${cp(o)}</div>
 <div class="copy"><div><span class="mut">Redirect URL</span><br><b>${esc(uri)}</b></div>${cp(uri)}</div>
 ${fld('client_id','Client ID',t.client_id,'text','inputmode="numeric" autocomplete="off"')}
 ${fld('client_secret','Client Secret','','password',`autocomplete="new-password" placeholder="${t.secret_set?'Saved. Leave blank to keep it':'Paste the secret from BotFather'}"`)}
 ${t.secret_set?`<button type="button" class="btn s r" style="margin:-4px 0 10px" onclick="if(confirm('Remove the saved secret and turn Telegram login off?'))act(()=>ad('/login/telegram',{m:'PUT',b:{clear_secret:1}}),'Secret removed')">Remove saved secret</button>`:''}</fieldset>
 <fieldset><legend>Button editor</legend>${fld('text','Button text',t.text,'text','maxlength="40"')}
 <div class="row" style="align-items:flex-start"><div class="grow">${fld('style','Style',t.style,['filled','outline','soft'])}</div><div class="grow">${fld('size','Size',t.size,['small','medium','large'])}</div></div>
 <label>Colour<input type="color" name="color" value="${esc(t.color)}"></label><div class="sw">${['#27a7e7','#229ed9','#0088cc','#1769e0','#0a1d36','#7c3aed'].map(c=>`<button type="button" style="background:${c}" data-set="color=${c}" aria-label="${c}"></button>`).join('')}</div>
 <label>Corner radius: <span id="rv">${t.radius}</span> px<input type="range" name="radius" min="0" max="30" value="${t.radius}"></label>
 ${chk('icon','Show the Telegram icon',t.icon)}${chk('wide','Full width button',t.wide)}</fieldset>
 <fieldset><legend>Google login</legend><div class="mut" style="padding:4px 0 12px">Coming next. It will be managed here in the same way.</div></fieldset>
 <div class="savebar"><button class="btn blk" id="lsv">Save changes</button></div></form>
 <div class="pv"><div class="mut" style="margin-bottom:8px">Live preview</div><div class="phone"><div class="bn">${logo(30)}<span>${esc(CFG.brand||'SMM Store')}</span></div><h3>Welcome back</h3><div class="mut" style="margin-bottom:12px">Log in to see your balance and orders.</div><div class="btn blk" style="pointer-events:none">Log in</div><div class="or"><span>or</span></div><div id="lpb"></div></div></div></div>`},
logs:async()=>(await ad('/logs')).map(l=>`<div class="card mut"><b>${esc(l.action)}</b> · ${esc(l.username||'system')} · ${d(l.created)}<br>${esc(l.detail)}</div>`).join('')};
function pvUpdate(f){const v=Object.fromEntries(new FormData(f)),pv=$('#pv');if(!pv)return;const a=okHex(v.accent)?v.accent:'#1769e0';pv.style.cssText=bv(a);
 $('#pvb').innerHTML=(v.logo?`<img class="logo" src="${esc(v.logo)}" width="30" height="30" alt="">`:MARK(30))+`<span>${esc(v.brand||'Shop name')}</span>`;
 const an=$('#pva');an.hidden=!v.announcement;an.querySelector('span').textContent=v.announcement||'';$('#pvt').textContent=v.tagline||''}
document.addEventListener('input',e=>{const f=e.target.closest('#sf');f&&pvUpdate(f)});
document.addEventListener('submit',async e=>{if(e.target.id!=='sf')return;e.preventDefault();const b=$('#sv');b.disabled=1;try{const v=Object.fromEntries(new FormData(e.target));await ad('/settings',{m:'PUT',b:v});CFG=await api('/config');applyBrand();toast('Saved. Customers will see the changes now.');CACHE[ck('admin')]=0}catch(x){toast(x.message,1)}b.disabled=0});
new MutationObserver(()=>{const f=$('#sf');f&&!f._i&&(f._i=1,pvUpdate(f))}).observe($('#main'),{childList:true});
function lpv(f){const v=Object.fromEntries(new FormData(f)),b=$('#lpb'),r=$('#rv');if(!b)return;r&&(r.textContent=v.radius);b.innerHTML=tgBtn({text:v.text,style:v.style,size:v.size,color:v.color,radius:v.radius,icon:!!v.icon,wide:!!v.wide})}
document.addEventListener('input',e=>{const f=e.target.closest('#lf');f&&lpv(f)});
document.addEventListener('submit',async e=>{if(e.target.id!=='lf')return;e.preventDefault();const b=$('#lsv');b.disabled=1;
 try{const v=Object.fromEntries(new FormData(e.target)),p={enabled:v.enabled?1:0,client_id:v.client_id.trim(),text:v.text,style:v.style,size:v.size,color:v.color,radius:+v.radius,icon:v.icon?1:0,wide:v.wide?1:0,site_url:location.origin};
  if(v.client_secret.trim())p.client_secret=v.client_secret.trim();await ad('/login/telegram',{m:'PUT',b:p});CFG=await api('/config');toast('Saved. The login screen is updated.');go('admin',1)}catch(x){toast(x.message,1)}b.disabled=0});
new MutationObserver(()=>{const f=$('#lf');f&&!f._i&&(f._i=1,lpv(f))}).observe($('#main'),{childList:true});
function sel(id,on){on?SEL.add(id):SEL.delete(id);$('#bulk').hidden=!SEL.size;$('#bn').textContent=SEL.size}
function selAll(){document.querySelectorAll('#alist>[data-s]:not([hidden]) .cb').forEach(c=>{c.checked=true;SEL.add(+c.dataset.id)});$('#bulk').hidden=!SEL.size;$('#bn').textContent=SEL.size}
function bulk(on){const n=SEL.size,ids=[...SEL];act(async()=>{await ad('/services/bulk',{b:{ids,enabled:on}});SEL.clear()},`${n} service${n>1?'s':''} ${on?'enabled':'disabled'}`)}
const adjust=id=>modal('Adjust balance',fld('amount','Amount (negative to deduct)','','number','step="0.01"')+fld('note','Reason (saved in the log)'),async(f,o)=>{await ad(`/users/${id}/balance`,{b:f});o.remove();toast('Balance updated');go('admin',1)});
const catList=(arr,def)=>`<datalist id="dl">${[...new Set([...def,...arr.map(x=>x.category)])].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`;
const svcForm=id=>{const s=ASV.find(x=>x.id===id)||{};modal(s.id?'Edit service':'New service',fld('category','Category',s.category||'TikTok','text','list="dl" required autocomplete="off"')+catList(ASV,['TikTok','Facebook','Telegram'])+fld('name','Name',s.name,'text','required')+fld('description','Description',s.description,'area')+`<div class="row" style="align-items:flex-start"><div class="grow">${fld('price','Sell price per 1,000',s.price,'number','step="0.0001" min="0" required')}</div><div class="grow">${fld('cost','Cost per 1,000',s.cost||0,'number','step="0.0001" min="0"')}</div></div><div class="tot"><span>Profit per 1,000</span><b id="pf"></b></div><div class="row" style="align-items:flex-start"><div class="grow">${fld('min_qty','Min quantity',s.min_qty||100,'number','min="1" required')}</div><div class="grow">${fld('max_qty','Max quantity',s.max_qty||10000,'number','min="1" required')}</div></div>`+fld('delivery','Delivery info (e.g. Start: 0-1 hour)',s.delivery)+fld('supplier_service','Supplier service ID (leave blank for manual)',s.supplier_service)+(s.id?chk('enabled','Visible to customers',s.enabled):''),
 async(f,o)=>{f.supplier_service=f.supplier_service||null;if(s.id)f.enabled=f.enabled?1:0;await(s.id?ad('/services/'+s.id,{m:'PUT',b:f}):ad('/services',{b:f}));o.remove();toast('Service saved');go('admin',1)},'Save service',o=>{const up=()=>{const p=+o.querySelector('[name=price]').value||0,c=+o.querySelector('[name=cost]').value||0,x=p-c;o.querySelector('#pf').innerHTML=`<span class="${x>=0?'pos':'neg'}">${m(x)}${p?` (${Math.round(x/p*100)}%)`:''}</span>`};o.addEventListener('input',up);up()})};
const prodForm=id=>{const p=APR.find(x=>x.id===id)||{};modal(p.id?'Edit product':'New product',imgField('image','Product image',p.image,640,'image/jpeg')+fld('category','Category',p.category||'Apps','text','list="dl" required autocomplete="off"')+catList(APR,['Apps','Software','Tools','Codes'])+fld('name','Name',p.name,'text','required')+fld('description','Description',p.description,'area')+fld('price','Price (USD)',p.price,'number','step="0.01" min="0" required')+(p.id?'':fld('delivery_type','Delivery',p.delivery_type||'auto',['auto','manual']))+fld('stock','Stock (manual products only)',p.stock||0,'number','min="0"')+(p.id?chk('enabled','Visible to customers',p.enabled):''),
 async(f,o)=>{if(p.id)f.enabled=f.enabled?1:0;await(p.id?ad('/products/'+p.id,{m:'PUT',b:f}):ad('/products',{b:f}));o.remove();toast('Product saved');go('admin',1)},'Save product')};
const stock=id=>modal('Add stock',fld('codes','One code or account per line','','area','rows="8"')+'<div class="mut" id="cn">0 codes</div>',async(f,o)=>{const r=await ad(`/products/${id}/stock`,{b:f});o.remove();toast(r.added+' codes added');go('admin',1)},'Add codes',o=>o.addEventListener('input',()=>o.querySelector('#cn').textContent=o.querySelector('textarea').value.split('\n').filter(x=>x.trim()).length+' codes'));
const imp=()=>modal('Import from supplier',fld('markup','Markup % over supplier cost',30,'number')+'<p class="mut">New services are imported as disabled. Review them, then use Select all shown and Enable.</p>',async(f,o)=>{const r=await ad('/services/import',{b:f});o.remove();toast(`${r.added} new, ${r.updated} updated`);go('admin',1)},'Import');
const smmStatus=id=>modal('Set order status',fld('status','Status','Processing',['Pending','Processing','Completed','Partial','Failed','Cancelled'])+fld('remains','Remaining quantity (Partial only)',0,'number'),async(f,o)=>{await ad(`/orders/smm/${id}/status`,{b:f});o.remove();go('admin',1)});
const deliver=id=>modal('Deliver order',fld('text','Credentials, code or message for the buyer','','area'),async(f,o)=>{await ad(`/orders/digital/${id}/deliver`,{b:f});o.remove();toast('Delivered');go('admin',1)},'Deliver');
const promoForm=()=>modal('New offer',fld('code','Code')+fld('title','Title')+fld('bonus_percent','Deposit bonus %',10,'number'),async(f,o)=>{await ad('/promos',{b:f});o.remove();go('admin',1)},'Create offer');
boot();
</script></body></html>
